<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relógio</title>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUmVsw7NnaW8iLCJzaG9ydF9uYW1lIjoiUmVsw7NnaW8iLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBhMGEwYSIsInRoZW1lX2NvbG9yIjoiIzBhMGEwYSJ9">
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#f5f5f5;
    --accent:#7dd3fc;
    --font-clock:'Segoe UI', system-ui, sans-serif;
    --panel-bg: rgba(20,20,20,0.92);
    --panel-fg: #eaeaea;
    --panel-border: rgba(255,255,255,0.08);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f5f5; --fg:#111; --panel-bg: rgba(255,255,255,0.94); --panel-fg:#111; --panel-border: rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="dark"]{ --bg:#0a0a0a; --fg:#f5f5f5; }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    background:var(--bg);
    color:var(--fg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:background .4s ease,color .4s ease;
    font-family:var(--font-clock);
    -webkit-user-select:none;
    user-select:none;
  }

  #clockWrap{
    text-align:center;
    cursor:pointer;
  }
  #time{
    font-size:min(20vw,18vh);
    font-weight:700;
    letter-spacing:2px;
    line-height:1;
    font-variant-numeric: tabular-nums;
    color:var(--fg);
    text-shadow: 0 0 30px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  #time .accent{ color:var(--accent); }
  #date{
    margin-top:1.2vh;
    font-size:min(3.2vw,3.2vh);
    opacity:0.75;
    text-transform:capitalize;
    letter-spacing:1px;
  }
  #seconds-small{
    font-size:0.45em;
    opacity:0.7;
    vertical-align:baseline;
  }

  /* Toggle button to open settings */
  #gearBtn{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 16px);
    right:16px;
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);
    color:var(--panel-fg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    opacity:0;
    transition:opacity .25s ease, transform .2s ease;
    z-index:20;
    font-size:20px;
  }
  body:hover #gearBtn, #gearBtn:focus, #gearBtn.show{ opacity:0.85; }
  #gearBtn:hover{ transform:rotate(25deg); opacity:1; }

  #fsBtn{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 16px);
    right:70px;
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);
    color:var(--panel-fg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    opacity:0;
    transition:opacity .25s ease;
    z-index:20;
    font-size:18px;
  }
  body:hover #fsBtn, #fsBtn.show{ opacity:0.85; }
  #fsBtn:hover{ opacity:1; }

  /* Settings panel */
  #panel{
    position:fixed;
    top:0;right:0;
    height:100%;
    width:320px;
    max-width:88vw;
    background:var(--panel-bg);
    color:var(--panel-fg);
    border-left:1px solid var(--panel-border);
    padding:calc(env(safe-area-inset-top,0px) + 24px) 22px 24px;
    transform:translateX(100%);
    transition:transform .3s ease;
    overflow-y:auto;
    z-index:30;
    backdrop-filter: blur(10px);
  }
  #panel.open{ transform:translateX(0); }
  #panel h2{
    margin:0 0 18px;
    font-size:18px;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  #panel .group{ margin-bottom:20px; }
  #panel label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    opacity:0.6;
    margin-bottom:8px;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  #panel .row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:14px; font-family:'Segoe UI', system-ui, sans-serif;}
  #panel select, #panel input[type=color]{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.06);
    color:var(--panel-fg);
    font-size:14px;
  }
  #panel input[type=color]{ padding:2px; height:38px; cursor:pointer; }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{
    width:28px;height:28px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .swatch.active{ border-color:var(--panel-fg); }
  .switch{
    position:relative; width:42px; height:24px;
    background:rgba(255,255,255,0.15);
    border-radius:20px; cursor:pointer; flex-shrink:0;
  }
  .switch.on{ background:var(--accent); }
  .switch::after{
    content:'';
    position:absolute; top:2px; left:2px;
    width:20px;height:20px;border-radius:50%;
    background:#fff;
    transition:left .2s ease;
  }
  .switch.on::after{ left:20px; }
  #closePanel{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 20px); left:18px;
    background:none;border:none;color:var(--panel-fg);
    font-size:20px;cursor:pointer;opacity:0.6;
  }
  #closePanel:hover{ opacity:1; }
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:25;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }

  #hint{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    left:50%; transform:translateX(-50%);
    font-size:11px; opacity:0; letter-spacing:0.5px;
    font-family:'Segoe UI', system-ui, sans-serif;
    transition:opacity .3s ease;
    color:var(--fg);
  }
  body:hover #hint{ opacity:0.4; }
</style>
</head>
<body>

<div id="overlay"></div>

<button id="fsBtn" title="Tela cheia (F)">⛶</button>
<button id="gearBtn" title="Personalizar">⚙</button>

<div id="clockWrap">
  <div id="time">00:00</div>
  <div id="date">segunda-feira, 1 de janeiro</div>
</div>

<div id="hint">clique no relógio ou pressione F para tela cheia · ⚙ para personalizar</div>

<div id="panel">
  <button id="closePanel">✕</button>
  <h2>Personalizar</h2>

  <div class="group">
    <label>Formato</label>
    <select id="fmt24">
      <option value="24">24 horas</option>
      <option value="12">12 horas (AM/PM)</option>
    </select>
  </div>

  <div class="group">
    <div class="row">
      <span>Mostrar segundos</span>
      <div class="switch on" id="toggleSeconds"></div>
    </div>
    <div class="row">
      <span>Mostrar data</span>
      <div class="switch on" id="toggleDate"></div>
    </div>
    <div class="row">
      <span>Destacar segundos</span>
      <div class="switch on" id="toggleAccentSeconds"></div>
    </div>
  </div>

  <div class="group">
    <label>Cor de destaque</label>
    <div class="swatches" id="accentSwatches"></div>
  </div>

  <div class="group">
    <label>Tema</label>
    <select id="themeSelect">
      <option value="dark">Escuro</option>
      <option value="light">Claro</option>
      <option value="system">Seguir sistema</option>
    </select>
  </div>

  <div class="group">
    <label>Cor de fundo (personalizada)</label>
    <input type="color" id="bgColor" value="#0a0a0a">
  </div>

  <div class="group">
    <label>Cor do texto (personalizada)</label>
    <input type="color" id="fgColor" value="#f5f5f5">
  </div>

  <div class="group">
    <label>Fonte</label>
    <select id="fontSelect">
      <option value="'Segoe UI', system-ui, sans-serif">Segoe UI</option>
      <option value="'Consolas','Courier New', monospace">Monoespaçada</option>
      <option value="'Georgia', serif">Serifada</option>
      <option value="'Arial Black', sans-serif">Bold / Cartaz</option>
      <option value="'Comic Sans MS', cursive">Descontraída</option>
    </select>
  </div>

  <div class="group">
    <label>Idioma da data</label>
    <select id="localeSelect">
      <option value="pt-BR">Português (BR)</option>
      <option value="en-US">Inglês</option>
      <option value="es-ES">Espanhol</option>
    </select>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), dateEl = $('date');
  const panel = $('panel'), overlay = $('overlay');
  const gearBtn = $('gearBtn'), closePanel = $('closePanel'), fsBtn = $('fsBtn');
  const clockWrap = $('clockWrap');

  const defaults = {
    fmt24:'24', showSeconds:true, showDate:true, accentSeconds:true,
    accent:'#7dd3fc', theme:'dark', bg:'#0a0a0a', fg:'#f5f5f5',
    font:"'Segoe UI', system-ui, sans-serif", locale:'pt-BR', useCustomColors:false
  };

  let state = {...defaults};
  try{
    const saved = localStorage.getItem('relogio-settings');
    if(saved) state = {...state, ...JSON.parse(saved)};
  }catch(e){}

  function save(){
    try{ localStorage.setItem('relogio-settings', JSON.stringify(state)); }catch(e){}
  }

  const accentColors = ['#7dd3fc','#f472b6','#a78bfa','#34d399','#fbbf24','#fb7185','#94a3b8','#ffffff'];

  function buildSwatches(){
    const wrap = $('accentSwatches');
    wrap.innerHTML = '';
    accentColors.forEach(c=>{
      const s = document.createElement('div');
      s.className = 'swatch' + (state.accent===c ? ' active':'');
      s.style.background = c;
      s.onclick = ()=>{ state.accent=c; applyState(); save(); };
      wrap.appendChild(s);
    });
  }

  function applyState(){
    const root = document.documentElement;
    root.style.setProperty('--accent', state.accent);
    root.style.setProperty('--font-clock', state.font);

    if(state.theme==='system'){
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', state.theme);
    }

    if(state.useCustomColors){
      root.style.setProperty('--bg', state.bg);
      root.style.setProperty('--fg', state.fg);
    } else {
      root.style.removeProperty('--bg');
      root.style.removeProperty('--fg');
    }

    $('fmt24').value = state.fmt24;
    $('themeSelect').value = state.theme;
    $('fontSelect').value = state.font;
    $('localeSelect').value = state.locale;
    $('bgColor').value = state.bg;
    $('fgColor').value = state.fg;
    $('toggleSeconds').classList.toggle('on', state.showSeconds);
    $('toggleDate').classList.toggle('on', state.showDate);
    $('toggleAccentSeconds').classList.toggle('on', state.accentSeconds);
    buildSwatches();
  }

  function pad(n){ return n.toString().padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let h = now.getHours();
    let ampm = '';
    if(state.fmt24==='12'){
      ampm = h>=12 ? ' PM' : ' AM';
      h = h % 12; if(h===0) h=12;
    }
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());

    let html = `${state.fmt24==='12'?h:pad(h)}:${m}`;
    if(state.showSeconds){
      html += state.accentSeconds
        ? `<span class="accent">:${s}</span>`
        : `:${s}`;
    }
    html += ampm ? `<span style="font-size:.4em;opacity:.7;"> ${ampm.trim()}</span>` : '';
    timeEl.innerHTML = html;

    if(state.showDate){
      dateEl.style.display='';
      dateEl.textContent = now.toLocaleDateString(state.locale, {
        weekday:'long', day:'numeric', month:'long'
      });
    } else {
      dateEl.style.display='none';
    }
  }
  tick();
  setInterval(tick, 250);

  // Panel open/close
  function openPanel(){ panel.classList.add('open'); overlay.classList.add('show'); }
  function closePanelFn(){ panel.classList.remove('open'); overlay.classList.remove('show'); }
  gearBtn.onclick = openPanel;
  closePanel.onclick = closePanelFn;
  overlay.onclick = closePanelFn;

  // Fullscreen
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }
  fsBtn.onclick = toggleFullscreen;
  clockWrap.onclick = toggleFullscreen;
  document.addEventListener('keydown', e=>{
    if(e.key.toLowerCase()==='f') toggleFullscreen();
    if(e.key==='Escape' && panel.classList.contains('open')) closePanelFn();
  });

  // Controls
  $('fmt24').onchange = e=>{ state.fmt24=e.target.value; save(); };
  $('themeSelect').onchange = e=>{ state.theme=e.target.value; applyState(); save(); };
  $('fontSelect').onchange = e=>{ state.font=e.target.value; applyState(); save(); };
  $('localeSelect').onchange = e=>{ state.locale=e.target.value; save(); };
  $('bgColor').oninput = e=>{ state.bg=e.target.value; state.useCustomColors=true; applyState(); save(); };
  $('fgColor').oninput = e=>{ state.fg=e.target.value; state.useCustomColors=true; applyState(); save(); };

  $('toggleSeconds').onclick = ()=>{ state.showSeconds=!state.showSeconds; applyState(); save(); };
  $('toggleDate').onclick = ()=>{ state.showDate=!state.showDate; applyState(); save(); };
  $('toggleAccentSeconds').onclick = ()=>{ state.accentSeconds=!state.accentSeconds; applyState(); save(); };

  applyState();
})();
</script>
</body>
</html>
